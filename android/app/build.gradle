plugins { id 'com.android.application' }
android {
    namespace 'com.guaco.swipe'
    compileSdk 34
    defaultConfig {
        applicationId 'com.guaco.swipe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release { storeFile file('../keystore/swipe.jks'); storePassword 'guacoswipe'; keyAlias 'swipe'; keyPassword 'guacoswipe' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.release }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
